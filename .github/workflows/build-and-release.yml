name: Build and Release JAR

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
      - 'release-*'
      
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with Maven
        run: mvn -B package --file Autocare/pom.xml

      - name: Verify JAR was built
        run: ls -la Autocare/target/*.jar

      # Upload the fat JAR (includes MySQL driver) named autocare-germantown.jar
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: autocare-jar
          path: Autocare/target/autocare-germantown.jar

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Only create a GitHub Release when the workflow runs on a tag (e.g. refs/tags/v1.0.0)
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: autocare-jar
          path: release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "release-artifacts/*.jar"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
